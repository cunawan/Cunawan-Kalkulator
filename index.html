<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Belanja</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff9c4; padding: 10px; }
        table { width: 100%; border-collapse: collapse; background: #fffde7; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #fbc02d; color: #333; }
        input { width: 90%; border: none; background: transparent; text-align: center; font-size: 14px; }
        .total-box { margin-top: 15px; font-weight: bold; font-size: 18px; text-align: right; }
        button { padding: 8px 15px; background: #1976d2; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <table id="cartTable">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Produk</th>
                <th>Harga</th>
                <th>Jumlah</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Baris data akan ditambahkan lewat JavaScript -->
        </tbody>
    </table>

    <div class="total-box">
        Total: Rp <span id="grandTotal">0</span>
    </div>
    <br>
    <button onclick="addRow()">+ Tambah Baris</button>

    <script>
        let rowCount = 0;

        function addRow() {
            rowCount++;
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');

            row.innerHTML = 
                <td>${rowCount}</td>
                <td><input type="text" placeholder="Nama Barang" class="p-name"></td>
                <td><input type="number" placeholder="0" class="p-price" oninput="calculateRow(this)"></td>
                <td><input type="number" value="1" class="p-qty" oninput="calculateRow(this)"></td>
                <td class="p-total">0</td>
            ;
            tbody.appendChild(row);
        }

        function calculateRow(element) {
            const row = element.parentElement.parentElement;
            const price = parseFloat(row.querySelector('.p-price').value) || 0;
            const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
            const total = price * qty;
            
            row.querySelector('.p-total').innerText = total.toLocaleString('id-ID');
            calculateGrandTotal();
        }

        function calculateGrandTotal() {
            let grandTotal = 0;
            const totals = document.querySelectorAll('.p-total');
            totals.forEach(td => {
                const val = parseFloat(td.innerText.replace(/\./g, '')) || 0;
                grandTotal += val;
            });
            document.getElementById('grandTotal').innerText = grandTotal.toLocaleString('id-ID');
        }

        // Tambah baris pertama secara otomatis saat dibuka
        addRow();
    </script>
</body>
</html>
